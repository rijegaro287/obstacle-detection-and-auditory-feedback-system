name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
      - name: install-dependencies
        run: ./prepare_environment.sh
      - name: build
        run: |
          cd ./embedded-application/
          ./compile.sh
